name: Deploy Supabase Edge Functions

# v0.6.24: deploys only when function code (or this workflow) changes, instead of on every push to main.
# Run it manually from the Actions tab (workflow_dispatch) at any time.
on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-supabase-function.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never run two deployments at the same time; a newer push waits for the one in progress.
concurrency:
  group: deploy-supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Supabase functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify deployment secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN is not configured."; exit 1; }
          test -n "$SUPABASE_PROJECT_ID" || { echo "SUPABASE_PROJECT_ID is not configured."; exit 1; }

      - name: Deploy ai-chat
        run: supabase functions deploy ai-chat --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy document-library
        run: supabase functions deploy document-library --project-ref "$SUPABASE_PROJECT_ID"
