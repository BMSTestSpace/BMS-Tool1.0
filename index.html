<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BMS Troubleshooter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f0f2f5;
      --surface: #ffffff;
      --surface2: #f5f7fa;
      --border: #dde1ea;
      --border-bright: #b0bcd4;
      --text: #1a2233;
      --text-muted: #5a6a8a;
      --text-dim: #a0aabb;
      --accent: #16a34a;
      --accent-dim: #dcfce7;
      --green: #22c55e;
      --green-dim: #dcfce7;
      --amber: #d97706;
      --amber-dim: #fef3c7;
      --red: #ef4444;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'IBM Plex Sans', sans-serif;
    }

    /* ── Login modal ── */
    #login-overlay {
      position: fixed; inset: 0; z-index: 999;
      background: rgba(200, 210, 225, 0.85);
      display: flex; align-items: center; justify-content: center;
    }
    #login-overlay.hidden { display: none; }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border-bright);
      border-radius: 10px;
      padding: 32px 28px;
      width: 340px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .login-logo {
      display: flex; align-items: center; gap: 10px; margin-bottom: 24px;
    }

    .login-logo-badge {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: var(--accent);
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      border-radius: 3px;
      padding: 2px 7px;
    }

    .login-logo-title {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--text);
    }

    .login-heading {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.08em;
      margin-bottom: 20px;
    }

    .login-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .login-field label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .login-field input {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 9px 12px;
      font-family: var(--sans);
      font-size: 13px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }

    .login-field input:focus { border-color: var(--accent); }
    .login-field input::placeholder { color: var(--text-dim); }

    .login-error {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--red);
      margin-bottom: 10px;
      min-height: 14px;
    }

    .login-submit {
      width: 100%;
      padding: 10px;
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      border-radius: 5px;
      color: var(--accent);
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 4px;
    }
    .login-submit:hover { background: #26396a; }
    .login-submit:disabled { opacity: 0.5; cursor: default; }

    /* ── Save status toast ── */
    #save-toast {
      position: fixed;
      bottom: 20px; right: 20px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 14px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      z-index: 100;
    }
    #save-toast.show { opacity: 1; transform: translateY(0); }
    #save-toast.ok { color: var(--green); border-color: var(--green-dim); }
    #save-toast.err { color: var(--red); }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
    }

    .header-badge {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: var(--accent);
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      border-radius: 3px;
      padding: 2px 7px;
      text-transform: uppercase;
    }

    header h1 {
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: 0.04em;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      margin-left: auto;
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .main {
      display: grid;
      grid-template-columns: 1fr 340px;
      flex: 1;
      overflow: hidden;
      height: calc(100vh - 49px);
    }

    /* Flow panel */
    .flow-panel {
      border-right: 1px solid var(--border);
      overflow: auto;
      background: var(--bg);
      position: relative;
    }

    .flow-panel-label {
      position: sticky;
      top: 0;
      left: 0;
      z-index: 10;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      padding: 8px 14px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      text-transform: uppercase;
    }

    #flow-container {
      padding: 16px;
    }

    #flow-svg {
      display: block;
      overflow: visible;
    }

    /* Right column panel setup */
    .right-panel {
      display: flex;
      flex-direction: column;
      background: var(--surface);
      overflow: hidden;
    }

    .q-panel-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      text-transform: uppercase;
      background: var(--surface);
      flex-shrink: 0;
    }

    .history-trail {
      padding: 4px 16px;
      border-bottom: 1px solid var(--border);
      min-height: 32px;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
      overflow: hidden;
      background: var(--surface);
      flex-shrink: 0;
    }

    .crumb {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-dim);
      white-space: nowrap;
    }

    .crumb-sep {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-dim);
    }

    .crumb.active { color: var(--accent); }

    /* Top interactive question half */
    .q-content {
      flex: 0 0 auto;
      overflow-y: auto;
      padding: 16px;
    }

    .step-counter {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .q-text {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.4;
      margin-bottom: 14px;
    }

    .ans-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      margin-bottom: 6px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--surface2);
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      text-align: left;
    }

    .ans-btn:hover {
      border-color: var(--accent);
      background: var(--accent-dim);
      color: var(--accent);
    }

    .ans-btn::before {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--text-dim);
      flex-shrink: 0;
      transition: background 0.15s;
    }

    .ans-btn:hover::before { background: var(--accent); }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 10px 0;
    }

    .nav-row {
      display: flex;
      gap: 8px;
    }

    .nav-btn {
      flex: 1;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: transparent;
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 11px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .nav-btn:hover { border-color: var(--border-bright); color: var(--text); }
    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: var(--border);
      color: var(--text-dim);
    }

    /* Result styling */
    .result-box {
      border: 1px solid #f97316;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 12px;
      background: #fff7ed;
    }

    .result-section {
      padding: 10px 12px;
    }

    .result-section + .result-section {
      border-top: 1px solid #fed7aa;
    }

    .result-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .result-diag {
      font-size: 13px;
      font-weight: 500;
      color: #c2410c;
    }

    .result-action {
      font-size: 13px;
      color: #7c3510;
      line-height: 1.4;
    }

    .restart-btn {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: transparent;
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.04em;
    }

    .restart-btn:hover {
      border-color: var(--border-bright);
      color: var(--text);
    }

    /* SVG node styles */
    .flow-node { cursor: pointer; }
    .flow-node rect { transition: filter 0.15s; }
    .flow-node:hover rect { filter: brightness(1.15); }

    /* ── Integrated Gemini Box (Bottom-Right Panel) ── */
    .gem-panel-divider {
      height: 1px;
      background: var(--border-bright);
      flex-shrink: 0;
    }

    .gemini-integrated-box {
      height: 380px;
      display: flex;
      flex-direction: column;
      background: var(--surface2);
      flex-shrink: 0;
    }

    .gem-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .gem-dot { width: 14px; height: 14px; border-radius: 50%; background: linear-gradient(135deg,#4285f4,#34a853); flex-shrink:0; }
    .gem-title { font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--text); flex: 1; }
    .gem-sub { font-family: var(--mono); font-size: 9px; color: var(--text-dim); }

    .gem-messages {
      flex: 1; overflow-y: auto;
      padding: 12px; display: flex; flex-direction: column; gap: 8px;
    }
    .gem-msg {
      max-width: 90%; font-size: 12px; line-height: 1.5;
      padding: 8px 11px; border-radius: 8px; font-family: var(--sans);
    }
    .gem-msg.user {
      align-self: flex-end;
      background: var(--accent-dim); color: var(--accent);
      border: 1px solid var(--accent); border-bottom-right-radius: 2px;
    }
    .gem-msg.ai {
      align-self: flex-start;
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border); border-bottom-left-radius: 2px;
    }

    .gem-quick-btns { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 12px 6px; overflow-x: auto; flex-shrink: 0; }
    .gem-quick-btn {
      font-family: var(--mono); font-size: 9px;
      padding: 3px 8px; border: 1px solid var(--border); border-radius: 12px;
      background: var(--surface); color: var(--text-muted); cursor: pointer;
      transition: border-color 0.15s, color 0.15s; white-space: nowrap;
    }
    .gem-quick-btn:hover { border-color: var(--accent); color: var(--accent); }

    .gem-input-row {
      display: flex; gap: 6px; padding: 8px 12px 12px;
      background: var(--surface);
      border-top: 1px solid var(--border); flex-shrink: 0;
    }
    .gem-input {
      flex: 1; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; padding: 6px 10px;
      font-family: var(--sans); font-size: 12px; color: var(--text);
      outline: none; transition: border-color 0.15s;
    }
    .gem-input:focus { border-color: var(--accent); }
    .gem-input::placeholder { color: var(--text-dim); }
    .gem-send {
      background: var(--accent); border: none; border-radius: 6px;
      width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0; transition: opacity 0.15s;
    }
    .gem-send:hover { opacity: 0.85; }
    .gem-send:disabled { opacity: 0.4; cursor: default; }


    /* Mobile field layout: version 0.3.1-mobile */
    .mobile-tabs { display: none; }

    @media (max-width: 760px) {
      html, body { width: 100%; min-height: 100%; overflow-x: hidden; }
      body { min-height: 100dvh; }

      header {
        min-height: 52px;
        padding: 10px 12px;
        gap: 8px;
        position: sticky;
        top: 0;
        z-index: 80;
      }
      header h1 { font-size: 13px; }
      .header-badge { font-size: 9px; padding: 3px 6px; }
      #user-chip {
        max-width: 38vw;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 10px !important;
      }
      .status-dot { flex: 0 0 auto; }

      .mobile-tabs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        position: sticky;
        top: 52px;
        z-index: 75;
        padding: 8px 10px;
        background: rgba(240, 242, 245, 0.96);
        border-bottom: 1px solid var(--border);
        backdrop-filter: blur(10px);
      }
      .mobile-tab {
        min-height: 42px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: var(--surface);
        color: var(--text-muted);
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 500;
        cursor: pointer;
        touch-action: manipulation;
      }
      .mobile-tab.active {
        color: #fff;
        background: var(--accent);
        border-color: var(--accent);
      }

      .main {
        display: block;
        height: auto;
        min-height: calc(100dvh - 111px);
        overflow: visible;
      }
      .flow-panel, .right-panel {
        width: 100%;
        min-height: calc(100dvh - 111px);
        border: 0;
      }
      .flow-panel {
        display: none;
        overflow: auto;
        -webkit-overflow-scrolling: touch;
      }
      .right-panel {
        display: flex;
        overflow: visible;
      }
      body.mobile-view-map .flow-panel { display: block; }
      body.mobile-view-map .right-panel { display: none; }
      body.mobile-view-ai .flow-panel { display: none; }
      body.mobile-view-ai .q-panel-label,
      body.mobile-view-ai .history-trail,
      body.mobile-view-ai .q-content,
      body.mobile-view-ai .gem-panel-divider { display: none; }
      body.mobile-view-ai .right-panel { display: flex; min-height: calc(100dvh - 111px); }
      body.mobile-view-diagnose .gemini-integrated-box { display: none; }

      .flow-panel-label,
      .q-panel-label {
        position: sticky;
        top: 111px;
        z-index: 60;
        padding: 9px 12px;
      }
      #flow-container { padding: 12px; min-width: max-content; }

      .history-trail {
        min-height: 39px;
        padding: 7px 12px;
        flex-wrap: nowrap;
        overflow-x: auto;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .history-trail::-webkit-scrollbar { display: none; }

      .q-content {
        overflow: visible;
        padding: 18px 14px 32px;
      }
      .step-counter { font-size: 11px; margin-bottom: 10px; }
      .q-text {
        font-size: 18px;
        line-height: 1.42;
        margin-bottom: 18px;
      }
      .ans-btn {
        min-height: 52px;
        padding: 13px 14px;
        margin-bottom: 10px;
        border-radius: 10px;
        font-size: 15px;
        line-height: 1.35;
        touch-action: manipulation;
      }
      .ans-btn::before { width: 7px; height: 7px; }
      .ans-btn:active { transform: scale(0.99); }
      .nav-row { gap: 10px; margin-top: 14px; }
      .nav-btn, .restart-btn {
        min-height: 48px;
        padding: 12px;
        border-radius: 9px;
        font-size: 12px;
        touch-action: manipulation;
      }
      .result-box { border-radius: 10px; margin-bottom: 16px; }
      .result-section { padding: 14px; }
      .result-diag, .result-action { font-size: 15px; line-height: 1.5; }

      .gemini-integrated-box {
        display: flex;
        min-height: calc(100dvh - 111px);
        height: calc(100dvh - 111px);
        border: 0;
      }
      .gem-header { padding: 12px 14px; }
      .gem-messages {
        flex: 1;
        max-height: none;
        padding: 12px 14px;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .gem-quick-btns { padding: 8px 12px; overflow-x: auto; flex-wrap: nowrap; }
      .gem-input-row {
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
        position: sticky;
        bottom: 0;
      }
      .gem-input { min-height: 46px; font-size: 16px; border-radius: 10px; }
      .gem-send { width: 46px; height: 46px; border-radius: 10px; }

      .login-card {
        width: calc(100% - 28px);
        max-width: 380px;
        padding: 26px 20px;
        border-radius: 14px;
        max-height: calc(100dvh - 28px);
        overflow-y: auto;
      }
      .login-field input { min-height: 48px; font-size: 16px; }
      .login-submit { min-height: 48px; }
      #save-toast {
        left: 12px;
        right: 12px;
        bottom: calc(12px + env(safe-area-inset-bottom));
        text-align: center;
      }
    }

    @media (max-width: 380px) {
      header h1 { font-size: 12px; }
      #user-chip { display: none !important; }
      .mobile-tabs { padding-left: 8px; padding-right: 8px; }
      .mobile-tab { font-size: 10px; }
      .q-text { font-size: 17px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
    }

  </style>
</head>
<body>

<div id="login-overlay">
  <div class="login-card">
    <div class="login-logo">
      <span class="login-logo-badge">BMS</span>
      <span class="login-logo-title">Troubleshooter</span>
    </div>
    <div class="login-heading">identify yourself to continue</div>
    <div class="login-field">
      <label>Name</label>
      <input type="text" id="login-name" placeholder="Jane Smith" autocomplete="name" />
    </div>
    <div class="login-field">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="firstname.lastname@se.com" autocomplete="email" inputmode="email" pattern="^[^@\s]+@se\.com$" title="Enter your @se.com email address" />
    </div>
    <div class="login-error" id="login-error"></div>
    <button class="login-submit" id="login-btn" onclick="submitLogin()">start session →</button>
  </div>
</div>

<div id="save-toast"></div>

<header>
  <span class="header-badge">BMS</span>
  <h1>Troubleshooter</h1>
  <div id="user-chip" style="margin-left:auto;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--text-muted);"></div>
  <div class="status-dot" style="margin-left:0"></div>
</header>
<nav class="mobile-tabs" aria-label="Mobile workspace">
  <button class="mobile-tab active" type="button" data-view="diagnose" onclick="setMobileView('diagnose')">Diagnose</button>
  <button class="mobile-tab" type="button" data-view="map" onclick="setMobileView('map')">Flow map</button>
  <button class="mobile-tab" type="button" data-view="ai" onclick="setMobileView('ai')">Copilot</button>
</nav>

<div class="main">
  <div class="flow-panel">
    <div class="flow-panel-label">diagnostic tree</div>
    <div id="flow-container">
      <svg id="flow-svg"></svg>
    </div>
  </div>

  <div class="right-panel">
    <div class="q-panel-label">current step</div>
    <div class="history-trail" id="history-trail"></div>
    
    <div class="q-content" id="q-content"></div>

    <div class="gem-panel-divider"></div>

    <div class="gemini-integrated-box">
      <div class="gem-header">
        <div class="gem-dot"></div>
        <div class="gem-title">BMS Copilot <span class="gem-sub">Gemini 2.5</span></div>
      </div>
      <div class="gem-messages" id="gem-messages"></div>
      <div class="gem-quick-btns" id="gem-quick-btns"></div>
      <div class="gem-input-row">

 "r601", "No": "q640"}}, "q620": {"question": "Is the AHU that serves this VAV running and delivering airflow to the duct system?", "answers": {"Yes": "q622", "No": "r602", "Unknown": "q623"}, "notes": "Confirm actual upstream operation, not only an AHU command. Use fan proof, duct static, and a field airflow check where available."}, "q621": {"question": "Is the VAV damper commanded open?", "answers": {"Yes": "q630", "No": "r995"}}, "q630": {"question": "Which Schneider Electric VAV controller arrangement is installed?", "answers": {"MPV with built-in actuator": "q631", "RPV with built-in actuator": "q631", "MPC with hardwired actuator": "q632", "RPC with hardwired actuator": "q632", "Central AO-8 module": "q301", "Third-party/unit controller or network command": "q635", "Unknown": "q633"}, "notes": "MPV and RPV use built-in damper actuators. MPC and RPC require a separately hardwired actuator. Route to AO-8 only when a Central IO AO-8 module is physically installed."}, "q640": {"question": "What type of reheat control is used?", "answers": {"Floating/Digital": "q1601", "Modulating Analog": "q1501", "Electric Stages": "q1601"}}, "q622": {"question": "Is airflow present at the VAV inlet or upstream branch duct, with adequate inlet pressure for the box to deliver its setpoint?", "answers": {"Yes": "q624", "No": "r603", "Unknown": "q623"}, "notes": "Check at the box inlet or nearest approved test location. Do not assume that AHU operation guarantees airflow at this branch."}, "q623": {"question": "Can AHU fan proof, duct static, and an upstream field airflow check be confirmed?", "answers": {"Yes": "q622", "No": "r604"}}, "q624": {"question": "Is the airflow sensor reading believable compared with a field measurement?", "answers": {"Yes": "q621", "No": "q107"}}, "q631": {"question": "Does the MPV or RPV built-in actuator position and physical damper rotation follow the commanded position?", "answers": {"Yes": "q634", "No": "r605"}, "notes": "MPV and RPV have built-in actuators, so there is no separate field actuator signal wire or AO-8 module-health check for the damper output."}, "q632": {"question": "For the MPC or RPC, does the onboard analog output command and measured signal at the hardwired actuator input agree?", "answers": {"Yes": "q634", "No": "q1503"}, "notes": "MPC and RPC require a separately hardwired actuator. Use the controller onboard-output workflow unless the project actually uses a Central AO-8 module."}, "q633": {"question": "Can the installed controller, output point, and actuator type be identified from the as-built, submittal, controller label, or EBO point reference?", "answers": {"Yes": "q630", "No": "r606"}}, "q634": {"question": "With adequate inlet airflow, does the physical damper travel freely through the required range and is linkage/shaft engagement correct?", "answers": {"Yes": "r607", "No": "r608"}}, "q635": {"question": "Does the unit/controller-reported damper command and feedback change together, without an active local override or fault?", "answers": {"Yes": "q634", "No": "r609"}}, "r602": {"diagnosis": "Upstream AHU is not providing airflow", "action": "Troubleshoot the serving AHU, fan enable/proof, safeties, duct static, smoke/fire dampers, and upstream distribution before condemning the VAV."}, "r603": {"diagnosis": "No airflow or inadequate pressure is reaching the VAV inlet", "action": "Inspect the upstream branch for closed balancing/fire/smoke dampers, disconnected or collapsed duct, blockage, leakage, incorrect tap, or insufficient AHU static pressure."}, "r604": {"diagnosis": "Upstream air-system condition is not confirmed", "action": "Confirm the serving AHU identity, fan proof, duct static, and airflow at an upstream test point before testing the VAV controller or actuator."}, "r605": {"diagnosis": "MPV or RPV built-in damper actuator is not following command", "action": "Verify controller mode, application, actuator calibration, shaft engagement, mechanical obstruction, and controller faults. Do not look for an AO-8 module unless one is actually installed."}, "r606": {"diagnosis": "Controller/output/actuator arrangement is unknown", "action": "Identify the exact controller and actuator from labels, drawings, submittals, and EBO references before electrical testing. Avoid assuming a Central IO module exists."}, "r607": {"diagnosis": "Damper command and mechanical travel appear normal", "action": "Verify airflow pickup tubing, box factor/K-factor, inlet pressure, balancing, minimum/maximum airflow settings, duct condition, and downstream restrictions."}, "r608": {"diagnosis": "Damper or linkage mechanical problem", "action": "Inspect shaft engagement, set screws, linkage, blade obstruction, actuator mounting, and full-stroke setup. Repair mechanics before changing the control sequence."}, "r609": {"diagnosis": "Third-party or network-controlled damper path is not responding", "action": "Verify local controller faults, network command/feedback, local override, output configuration, actuator power, and OEM sequence. Use the exact unit documentation."}, "r601": {"diagnosis": "VAV controls appear to be responding", "action": "Verify system supply-air temperature and static pressure, upstream AHU availability, box inlet pressure, airflow pickup tubing orientation/condition, damper/linkage travel, design min/max airflow, balancing, duct restrictions, and reheat valve/stage operation. Compare actual field measurements with design values before changing control parameters."}, "q701": {"question": "What AHU symptom are you troubleshooting?", "answers": {"Fan Not Running": "q702", "No Cooling": "q710", "No Heating": "q720", "Static Pressure Issue": "q730", "Temperature Issue": "q121", "Offline": "q501"}, "notes": "RBravo equipment notes: RB-003, RB-013"}, "q702": {"question": "Is the AHU enabled by schedule/occupancy?", "answers": {"Yes": "q703", "No": "r995"}}, "q703": {"question": "Are all safeties and interlocks normal?", "answers": {"Yes": "q704", lant enable before troubleshooting the AHU cooling output."}, "r703": {"diagnosis": "Cooling medium is not reaching the AHU coil", "action": "Check isolation/control valves, pump operation, strainers, air, bypasses, coil piping, refrigerant circuit availability, and entering conditions."}, "r704": {"diagnosis": "Heating source or distribution is unavailable", "action": "Restore boiler/steam/electric-heat availability, required pump or pressure proof, valve lineup, and safeties before troubleshooting the AHU output."}, "r705": {"diagnosis": "Heating medium is not reaching the AHU coil", "action": "Check pump operation, isolation/control valves, steam pressure, traps, strainers, air, bypasses, and coil entering conditions."}, "r701": {"diagnosis": "AHU safety/interlock is preventing operation", "action": "Identify the exact active permissive or safety, including smoke/fire interface, freeze protection, high static, overload, fan proof, airflow proof, condensate, or local emergency stop. Do not bypass a life-safety or equipment-protection circuit. Correct the initiating cause and follow the approved reset procedure."}, "q801": {"question": "What RTU symptom are you troubleshooting?", "answers": {"Fan Not Running": "q802", "No Cooling": "q810", "No Heating": "q820", "Temperature Issue": "q121", "Offline": "q501"}, "notes": "RBravo equipment notes: RB-002, RB-003, RB-005, RB-006, RB-014, RB-015"}, "q802": {"question": "Is the RTU enabled by schedule/occupancy?", "answers": {"Yes": "q803", "No": "r995"}}, "q803": {"question": "Are safeties and interlocks normal?", "answers": {"Yes": "q804", "No": "r801"}}, "q804": {"question": "Is the fan command ON?", "answers": {"Yes": "q1601", "No": "r995"}}, "q810": {"question": "Is space/supply-air temperature accurate and is cooling enabled?", "answers": {"Yes": "q813", "No": "q121"}}, "q811": {"question": "Is a compressor/cooling-stage command present?", "answers": {"Yes": "q1601", "No": "r995"}}, "q820": {"question": "Is temperatu const NAV_KEYS = ['back', 'Restart'];

let currentUser = null;    
let sessionStart = null;
let tree = null;
let current = null;
let history = [];
let geminiReady = false;
let geminiMessages = [];

// Removed restoreUser() from layout cycle so login box ALWAYS pops up fresh
window.onload = function() {
  fetchTreeData();
};

function fetchTreeData() {
  fetch(DATA_URL, { cache: 'no-store' })
    .then(r => {
      if (!r.ok) throw new Error(`JSON request failed: HTTP ${r.status}`);
      return r.json();
    })
    .then(data => {
      // Supports either {start, steps} or the V5 {start, nodes} schema.
      if (data.nodes && !data.steps) {
        const steps = {};
        Object.entries(data.nodes).forEach(([id, node]) => {
          if (node.stepType === 'question' || node.question !== undefined) {
            steps[id] = {
              question: node.question || '',
              answers: Object.fromEntries((node.options || []).map(o => [o.label, o.next]))
            };
          } else {
            steps[id] = { diagnosis: node.diagnosis || '', action: node.action || '' };
          }
        });
        data = { start: data.start || 'q1', steps };
      }
      if (!data.start || !data.steps || !data.steps[data.start]) {
        throw new Error('Invalid troubleshooting JSON schema');
      }
      tree = data;
      current = tree.start;
      render();
      checkAppReady();
    })
    .catch((error) => {
      console.error('Troubleshooting data load failed:', error);
      // Fallback fallback if external asset fails to load
      tree = JSON.parse(JSON.stringify(EMBEDDED_TREE));
      current = tree.start;
      render();
      checkAppReady();
    });
}

// ─── User identity ────────────────────────────────────────────────────────────
function submitLogin() {
  const name = document.getElementById('login-name').value.trim();
  const email = document.getElementById('login-email').value.trim().toLowerCase();
  const err = document.getElementById('login-error');

  err.textContent = '';
  if (!name) {
    err.textContent = 'name is required';
    return;
  }
  if (!/^[^@\s]+@se\.com$/i.test(email)) {
    err.textContent = 'a valid @se.com email is required';
    return;
  }

  currentUser = { name, email };
  sessionStart = new Date().toISOString();
  document.getElementById('login-overlay').classList.add('hidden');
  document.getElementById('user-chip').textContent = name;
  sessionStorage.setItem('bms_user', JSON.stringify(currentUser));
  checkAppReady();
}

function checkAppReady() {
  if (tree && currentUser && !geminiReady) {
    geminiReady = true;
    geminiWelcome();

}

async function saveSession(resultStep) {
  if (!currentUser) return;

  const deviceAnswer = history[0]?.answer || null;
  const sessionRow = {
    user_name: currentUser.name.trim(),
    user_email: currentUser.email.trim().toLowerCase(),
    device_type: deviceAnswer,
    diagnosis: resultStep.diagnosis || null,
    action: resultStep.action || null,
    result_id: current,

  }
}

// ─── Layout engine ────────────────────────────────────────────────────────────
const NODE_W = 124, NODE_H = 36, GAP_X = 44, GAP_Y = 24;

function buildLayout() {
  const cols = {}, rows = {}, visited = new Set();
  const edges = [];

  function bfs() {
    const queue = [{ id: tree.start, col: 0, row: 0 }];
    const colCounters = {};

    while (queue.length) {
      const { id, col, row } = queue.shift();
      if (visited.has(id)) continue;
      visited.add(id);

      if (!(col in colCounters)) colCounters[col] = row;
      const r = Math.max(colCounters[col], row);
      colCounters[col] = r + 1;

      cols[id] = col;
      rows[id] = r;

      const s = tree.steps[id];
      if (!s) continue;
      const nexts = Object.entries(s.answers || {}).filter(([k]) => !NAV_KEYS.includes(k));
      const offset = -(nexts.length - 1) / 2;
      nexts.forEach(([label, nid], i) => {
        if (nid && tree.steps[nid]) {
          edges.push({ from: id, to: nid, label: nexts.length > 1 ? label : '' });
          if (!visited.has(nid)) {
            queue.push({ id: nid, col: col + Math.round(offset + i), row: r + 1 });
          }
        }
      });
    }
  }

  bfs();

  const allCols = Object.values(cols);
  const allRows = Object.values(rows);
  const minCol = Math.min(...allCols);
  const maxCol = Math.max(...allCols);
  const maxRow = Math.max(...allRows);

  const layout = {};
  Object.keys(cols).forEach(id => {
    const c = cols[id] - minCol;
    const r = rows[id];
    layout[id] = {
      x: c * (NODE_W + GAP_X) + 16,
      y: r * (NODE_H + GAP_Y) + 16,
      w: NODE_W,
      h: NODE_H
    };
  });

  const totalW = (maxCol - minCol + 1) * (NODE_W + GAP_X) + 32;
  const totalH = (maxRow + 1) * (NODE_H + GAP_Y) + 32;
  return { layout, edges, totalW, totalH };
}

function truncate(str, len) {
  if (!str) return '';
  return str.length > len ? str.substring(0, len - 2) + '..' : str;
}

function jumpTo(id) {
  if (!tree || !tree.steps[id]) return;
  const index = history.findIndex(h => h.stepId === id);
  if (index !== -1) {
    history = history.slice(0, index);
  } else {
    history = [];
  }
  current = id;
  render();
}

function render() {
  if (!tree) return;
  renderFlow();
  renderQuestion();
}

// ─── SVG renderer ─────────────────────────────────────────────────────────────
function renderFlow() {
  const { layout, edges, totalW, totalH } = buildLayout();
  const svg = document.getElementById('flow-svg');
  if (!svg) return;
  svg.setAttribute('viewBox', `0 0 ${totalW} ${totalH}`);
  svg.setAttribute('width', totalW);
  svg.setAttribute('height', totalH);
  svg.style.minWidth = totalW + 'px';

  const visitedSet = new Set(history.map(h => h.stepId));
  const activeEdges = new Set(history.map(h => h.stepId + '→' + h.nextId));

  let html = `<defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3a4a66" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-active" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#4ade80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-current" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#4ade80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>`;

  edges.forEach(({ from, to, label }) => {
    const fp = layout[from], tp = layout[to];
    if (!fp || !tp) return;
    const x1 = fp.x + fp.w / 2, y1 = fp.y + fp.h;
    const x2 = tp.x + tp.w / 2, y2 = tp.y;
    const my = (y1 + y2) / 2;
    const key = from + '→' + to;
    const isActive = activeEdges.has(key);
    const isCurrent = from === current || to === current;
    const stroke = isActive ? '#16a34a' : isCurrent ? '#16a34a' : '#dde1ea';
    const marker = isActive ? 'arr-active' : isCurrent ? 'arr-current' : 'arr';
    const sw = isActive ? 1.5 : 0.8;
    const opacity = isActive ? 1 : (visitedSet.has(from) || to === current ? 0.6 : 0.3);
    html += `<path d="M${x1} ${y1} C${x1} ${my+8},${x2} ${my-8},${x2} ${y2}" fill="none" stroke="${stroke}" stroke-width="${sw}" marker-end="url(#${marker})" opacity="${opacity}"/>`;
    if (label) {
      const lx = (x1 + x2) / 2 + 3, ly = my;
      html += `<text x="${lx}" y="${ly}" font-family="IBM Plex Mono,monospace" font-size="9" fill="${isActive ? '#16a34a' : '#b0bcd4'}">${truncate(label, 7)}</text>`;
    }
  });

  Object.entries(layout).forEach(([id, pos]) => {
    const s = tree.steps[id];
    if (!s) return;
    const isCurrent = id === current;
    const isVisited = visitedSet.has(id);
    const isResult = s.diagnosis !== undefined;

    let fill, stroke, textColor, sw;
    if (isCurrent) {
      fill = '#dcfce7'; stroke = '#16a34a'; textColor = '#16a34a'; sw = 1.5;
    } else if (isVisited) {
      fill = '#dcfce7'; stroke = '#16a34a'; textColor = '#16a34a'; sw = 1;
    } else if (isResult) {
      fill = '#fff7ed'; stroke = '#fdba74'; textColor = '#9a3412'; sw = 0.8;
    } else {
      fill = '#ffffff'; stroke = '#dde1ea'; textColor = '#a0aabb'; sw = 0.5;
    }

    const label = s.question ? truncate(s.question, 18) : (s.diagnosis ? truncate(s.diagnosis, 18) : id);
    html += `<g class="flow-node" onclick="jumpTo('${id}')">
      <rect x="${pos.x}" y="${pos.y}" width="${pos.w}" height="${pos.h}" rx="4" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>
      <text x="${pos.x + pos.w / 2}" y="${pos.y + pos.h / 2}" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Sans,sans-serif" font-size="11" font-weight="${isCurrent ? 500 : 400}" fill="${textColor}">${label}</text>
    </g>`;
  });

  svg.innerHTML = html;
}

// ─── Question panel ───────────────────────────────────────────────────────────
function appendStepNavigation(panel) {
  const divider = document.createElement('div');
  divider.className = 'divider';
  panel.appendChild(divider);

  const row = document.createElement('div');
  row.className = 'nav-row';

  const backBtn = document.createElement('button');
  backBtn.className = 'nav-btn';
  backBtn.type = 'button';
  backBtn.textContent = '← back';
  backBtn.disabled = history.length === 0;
  backBtn.onclick = () => {
    if (history.length === 0) return;
    const previous = history.pop();
    current = previous.stepId;
    render();
  };
  row.appendChild(backBtn);

  const restartBtn = document.createElement('button');
  restartBtn.className = 'nav-btn';
  restartBtn.type = 'button';
  restartBtn.textContent = '↺ restart';
  restartBtn.onclick = () => {
    history = [];
    current = tree.start;
    render();
  };
  row.appendChild(restartBtn);

  panel.appendChild(row);
}

function renderQuestion() {
  const panel = document.getElementById('q-content');
  const trail = document.getElementById('history-trail');
  if (!panel || !trail) return;
  const step = tree.steps[current];
  panel.innerHTML = '';

  trail.innerHTML = '';
  history.forEach((h, i) => {
    const c = document.createElement('span');
    c.className = 'crumb';
    c.textContent = h.answer;
    trail.appendChild(c);
    const sep = document.createElement('span');
    sep.className = 'crumb-sep';
    sep.textContent = ' › ';
    trail.appendChild(sep);
  });
  if (history.length) {
    const cur = document.createElement('span');
    cur.className = 'crumb active';
    cur.textContent = current;
    trail.appendChild(cur);
  }

  const sc = document.createElement('div');
  sc.className = 'step-counter';
  sc.textContent = `step_${String(history.length + 1).padStart(2, '0')}`;
  panel.appendChild(sc);

  // Check if it's a question step
  if (step.question !== undefined) {
    const q = document.createElement('div');
    q.className = 'q-text';
    q.textContent = step.question;
    panel.appendChild(q);

    const mainA = Object.entries(step.answers || {}).filter(([k]) => !NAV_KEYS.includes(k));
    const navA  = Object.entries(step.answers || {}).filter(([k]) => NAV_KEYS.includes(k));

    mainA.forEach(([ans, nid]) => {
      const btn = document.createElement('button');
      btn.className = 'ans-btn';
      btn.textContent = ans;
      btn.onclick = () => {
        history.push({ stepId: current, answer: ans, nextId: nid });
        current = nid;
        render();
      };
      panel.appendChild(btn);
    });

    appendStepNavigation(panel);
  } 
  // Else if it's a resolution/diagnosis step, trigger Supabase save
  else if (step.diagnosis !== undefined) {
    const box = document.createElement('div');
    box.className = 'result-box';

    const s1 = document.createElement('div');
    s1.className = 'result-section';
    s1.innerHTML = `<div class="result-label">DIAGNOSIS</div><div class="result-diag">${step.diagnosis}</div>`;
    box.appendChild(s1);

    if (step.action) {
      const s2 = document.createElement('div');
      s2.className = 'result-section';
      s2.innerHTML = `<div class="result-label">RECOMMENDED ACTION</div><div class="result-action">${step.action}</div>`;
      box.appendChild(s2);
    }
    panel.appendChild(box);

    appendStepNavigation(panel);

    // Call Supabase insertion automatically upon reaching conclusion node
    saveSession(step);
  }
}

// ─── Gemini AI ────────────────────────────────────────────────────────────────
function geminiWelcome() {
  const step = tree ? tree.steps[current] : null;
  const ctx = step?.question || step?.diagnosis || 'starting troubleshoot';
  geminiAddMsg('ai', `Hi ${currentUser ? currentUser.name.split(' ')[0] : 'there'}! I'm your BMS Copilot. You're currently at: "${ctx}". Ask me anything or use the quick buttons below.`);
  renderQuickBtns();
}

function renderQuickBtns() {
  const el = document.getElementById('gem-quick-btns');
  if (!el) return;
  el.innerHTML = '';
  const btns = [
    { label: '💡 Next step', prompt: 'Based on my troubleshooting path so far, what should I check next and why?' },
    { label: '📋 Summarize', prompt: 'Summarize my troubleshooting session so far and what the findings indicate.' },
    { label: '❓ Explain', prompt: 'Explain why the current step matters in BMS troubleshooting and what I should look for.' },
    { label: '⚡ Common mistakes', prompt: 'What are the most common mistakes technicians make at this stage of BMS troubleshooting?' },
  ];
  btns.forEach(b => {
    const btn = document.createElement('button');
    btn.className = 'gem-quick-btn';
    btn.textContent = b.label;
    btn.onclick = () => geminiAsk(b.prompt);
    el.appendChild(btn);
  });
}

function geminiContext() {
  const step = tree ? tree.steps[current] : null;
  const pathStr = history.map(h => `Q: "${tree.steps[h.stepId]?.question || h.stepId}" → A: "${h.answer}"`).join('\n');
  const resultInfo = step?.diagnosis ? `\nDiagnosis reached: "${step.diagnosis}"\nRecommended action: "${step.action || 'N/A'}"` : '';
  return `You are an expert BMS (Building Management System) field technician assistant helping a technician diagnose an issue.

Technician: ${currentUser?.name || 'Unknown'} (${currentUser?.email || 'N/A'})
Current step question: "${step?.question || step?.diagnosis || current}"

Troubleshooting path taken so far:
${pathStr || '(just started — no steps taken yet)'}${resultInfo}

Be concise and practical. Plain language. If listing steps, number them. Keep responses under 150 words unless detail is truly needed.`;
}

async function geminiAsk(userText) {
  if (!userText.trim()) return;
  geminiAddMsg('user', userText);
  document.getElementById('gem-input').value = '';
  const typingEl = geminiAddMsg('ai', '…thinking…');
  typingEl.style.color = 'var(--text-dim)';
  typingEl.style.fontStyle = 'italic';
  const sendBtn = document.getElementById('gem-send');
  if (sendBtn) sendBtn.disabled = true;

  const contents = [];
  contents.push({ role: 'user', parts: [{ text: geminiContext() }] });
  contents.push({ role: 'model', parts: [{ text: 'Understood. Ready to assist with BMS troubleshooting.' }] });
  geminiMessages.slice(0, -1).forEach(m => {
    contents.push({ role: m.role === 'user' ? 'user' : 'model', parts: [{ text: m.text }] });
  });
  contents.push({ role: 'user', parts: [{ text: userText }] });

  try {
    const res = await fetch("https://emkehdoofgaztuqmuyxw.supabase.co/functions/v1/ai-chat", {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${SB_KEY}`
      },
      body: JSON.stringify({ contents, generationConfig: { temperature: 0.7, maxOutputTokens: 400 } })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || `HTTP ${res.status}`);
    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'No response generated.';
    typingEl.textContent = reply;
    typingEl.style.color = '';
    typingEl.style.fontStyle = '';
    geminiMessages[geminiMessages.length - 1].text = reply;
  } catch (e) {
    console.error('[Gemini] Error:', e);
    typingEl.textContent = '⚠ Error: ' + e.message;
    typingEl.style.color = 'var(--red)';
    typingEl.style.fontStyle = '';
  }
  if (sendBtn) sendBtn.disabled = false;
}

function geminiSend() {
  const val = document.getElementById('gem-input').value.trim();
  if (val) geminiAsk(val);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.activeElement === document.getElementById('gem-input')) {
    e.preventDefault();
    geminiSend();
  }
});

function geminiAddMsg(role, text) {
  const el = document.createElement('div');
  el.className = `gem-msg ${role}`;
  el.textContent = text;
  const container = document.getElementById('gem-messages');
  container.appendChild(el);
  container.scrollTop = container.scrollHeight;
  geminiMessages.push({ role, text });
  return el;
}

function setMobileView(view) {
  document.body.classList.remove('mobile-view-diagnose', 'mobile-view-map', 'mobile-view-ai');
  document.body.classList.add(`mobile-view-${view}`);
  document.querySelectorAll('.mobile-tab').forEach(btn => {
    const selected = btn.dataset.view === view;
    btn.classList.toggle('active', selected);
    btn.setAttribute('aria-selected', selected ? 'true' : 'false');
  });
  if (view === 'map' && typeof drawFlow === 'function') {
    requestAnimationFrame(() => drawFlow());
  }
  if (view === 'ai') {
    requestAnimationFrame(() => document.getElementById('gem-input')?.focus({preventScroll:true}));
  }
  window.scrollTo({top: 0, behavior: 'smooth'});
}

document.body.classList.add('mobile-view-diagnose');
window.addEventListener('resize', () => {
  if (window.innerWidth > 760) {
    document.body.classList.remove('mobile-view-diagnose', 'mobile-view-map', 'mobile-view-ai');
  } else if (![...document.body.classList].some(c => c.startsWith('mobile-view-'))) {
    document.body.classList.add('mobile-view-diagnose');
  }
});

</script>
